databases:
  - name: mei-saas-db
    databaseName: mei_saas
    user: admin

services:
  # Backend Node.js Web Service
  - type: web
    name: mei-saas-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mei-saas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # Frontend React/Vite Static Site
  - type: web
    name: mei-saas-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mei-saas-backend
          envVarKey: RENDER_EXTERNAL_URL
